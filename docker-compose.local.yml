# LOCAL DEVELOPMENT DOCKER-COMPOSE
# Use this file for local testing.
# It uses the .env.local file for environment variables.
#
# To run: make local-up
# To stop: make local-down
# To view logs: make local-logs

services:
  # --- The Background Worker Service ---
  worker:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    container_name: sniper-worker-local
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
      # CRITICAL FIX: Mount source code directly to where the app runs to ensure live updates
      - ./src/worker:/app/worker
      - ./src/database:/app/database
      # - ./src:/app/src (Removed as it is not used by the running process)
    env_file:
      - ./.env.local
    environment:
      - POSTGRES_HOST=postgres
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  # --- Competitor Watcher Service ---
  watcher:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    container_name: sniper-watcher-local
    volumes:
      - ./scripts:/app/scripts
      - ./src/worker:/app/worker
      - ./src/database:/app/database
    env_file:
      - ./.env.local
    environment:
      - POSTGRES_HOST=postgres
    command: python /app/scripts/watch_competitors.py
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  # --- The API Service ---
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: sniper-api-local
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Match Worker Logic: Mount source directly
      - ./src/api:/app/api
      - ./src/worker:/app/worker # CRITICAL: Mount shared worker code (syncer, etc.)
      - ./src/database:/app/database
      # - ./src:/app/src (Removed)
    env_file:
      - ./.env.local
    environment:
      - POSTGRES_HOST=postgres
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  # --- PostgreSQL Service ---
  postgres:
    image: postgres:13
    container_name: postgres-local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env.local
    environment:
      - POSTGRES_HOST=0.0.0.0
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
